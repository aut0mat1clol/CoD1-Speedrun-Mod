// CoD1 Speedrun side-mod: WIPE all saved PBs (level + full-run).
// Executed by the menu: Options -> Speedrun -> Delete Runs ... -> Yes.
// Uses seta (same as sr_pb.cfg) so the cvars stay ARCHIVED and the
// cleared state is what the engine writes to config.cfg on exit.
