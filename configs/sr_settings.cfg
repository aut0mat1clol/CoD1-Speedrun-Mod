// CoD1 Speedrun side-mod - ARCHIVED SETTINGS (fallback for an un-patched exe)
// ===========================================================================
// The patched CoDSP.exe declares every setting below with the ARCHIVE flag on
// its own, so on a patched install this file is NOT needed at all.
//
// On a STOCK exe the mod creates its cvars with setcvar, and those are not
// archived - the engine will not write them to config.cfg and every setting
// resets on restart. Then put this file in main\ and run ONCE in the console:
//     exec sr_settings.cfg
//
// Do NOT put that exec into autoexec.cfg: this file DEFINES defaults, so
// running it again wipes your settings. Same rule as sr_pb.cfg for records.
//
// Only user-facing settings live here. Internal state (rt_*) is deliberately
// left out - it must not survive a restart.

// ---- HUD ----
seta sr_speedo     "1"        // speedometer
seta sr_spd_avg    "1"        // rolling 5s average under it
seta sr_igt        "1"        // master switch for both timer rows
seta sr_show_l     "1"        // LEVEL row
seta sr_show_fg    "1"        // FULL GAME row

// ---- precision ----
seta sr_tmr_dec    "3"        // timer digits: 1=tenths 2=hundredths 3=ms
seta sr_spd_dec    "3"        // speedometer digits (0..3)

// ---- timing ----
seta sr_ilmode     "0"        // 1 = level timer only (practising single maps)
seta sr_lvl_start  "1"        // 1 = L starts at the level autosave
seta sr_tail       "360"      // per-map tail correction, ms

// ---- misc ----
seta sr_firstmap   "training"
seta sr_debug      "0"
seta sr_spd_raw    "1"        // 1 = exact per-frame speed, 0 = smoothed
seta sr_velprec    "0"        // 0 = auto-detect the bridge scale
seta sr_lvl_pre    "0"        // intro countdown length, 0 = auto
seta sr_spd_hyst   "0"        // speedometer deadband, u/s
